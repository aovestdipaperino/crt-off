[package]
name = "crt-off"
version = "0.2.0"
readme = "README.md"
edition = "2024"
description = "CRT screen-off animation for the terminal — vertical collapse with RGB chromatic aberration, scanline, and phosphor dot fade"
license = "Apache-2.0"
repository = "https://github.com/aovestdipaperino/crt-off"
keywords = ["terminal", "animation", "crt", "retro", "tui"]
categories = ["command-line-interface", "visualization"]
exclude = ["ElectronBeam.java", "Kitt-logo.png"]

[dependencies]
crossterm = { version = "0.28", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
logo-art = { version = "0.2.1", optional = true }

[features]
default = ["cli"]
# The animation in the terminal; without it, `render_frame` renders frames as pixels.
terminal = ["dep:crossterm"]
cli = ["terminal", "dep:logo-art"]

[[bin]]
name = "crt-off"
required-features = ["cli"]
